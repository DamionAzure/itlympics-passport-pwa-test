<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ITLympics Skills Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="vendor/supabase.js"></script>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="eyebrow">ITLympics 2027</p>
      <h1 class="stamp-font">Skills Registration</h1>
    </div>
  </header>
  <nav class="pagenav">
    <a href="index.html">Passport</a>
    <a href="booth.html">QR Booth</a>
    <a href="skills.html" class="active">Skills Reg</a>
    <a href="entrance.html">Entrance</a>
    <a href="vote.html">Vote</a>
    <a href="testing.html">Testing</a>
    <a href="dashboard.html">Dashboard</a>
  </nav>

  <div class="status-bar">
    <div><span class="dot" id="netDot"></span><span id="netLabel">Venue wifi: checking...</span></div>
  </div>

  <div id="authGate"></div>

  <div id="formView" class="card" style="display:none;">
    <p style="font-size:13px;color:var(--text-muted);margin-top:0;">Register for a Skills event. Student ID doubles as your passport ID — if you've already registered on the Passport page, it's pre-filled below.</p>

    <label for="skName">Full name</label>
    <input type="text" id="skName" placeholder="Juan Dela Cruz">

    <label for="skId">Student ID</label>
    <input type="text" id="skId" placeholder="23-0123">

    <label for="skSection">Section</label>
    <div class="combobox">
      <input type="text" id="skSection" placeholder="Type to search, e.g. BSIT" autocomplete="off">
      <div class="combobox-list" id="skSectionList"></div>
    </div>

    <p class="err" id="skErr" style="display:none;"></p>
    <button class="btn-primary" onclick="submitSkillsReg()">Register for Skills event</button>
  </div>

  <div id="doneView" class="card" style="display:none;">
    <h3 style="margin-top:0;">You're registered!</h3>
    <p style="font-size:13px;color:var(--text-muted);" id="doneSummary"></p>
    <button class="btn-ghost" onclick="editRegistration()">Edit details</button>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script>
let state = loadState(), cfg = loadCfg(), sb = null;
const SKILLS_KEY = 'itlympics_skills_reg_v1';

function loadSkillsReg(){ try{ const r = localStorage.getItem(SKILLS_KEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function saveSkillsReg(reg){ try{ localStorage.setItem(SKILLS_KEY, JSON.stringify(reg)); }catch(e){} }

function showToast(msg, warn){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  t.classList.toggle('warn', !!warn);
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), warn ? 3600 : 2400);
}

function renderNetStatus(){
  const dot=document.getElementById('netDot'), label=document.getElementById('netLabel');
  dot.className='dot '+(state.online?'on':'off');
  label.textContent = state.online ? 'Venue wifi: online' : 'Venue wifi: offline — will save locally and sync later';
}

let chosenSection = null;
let sectionsList = SECTIONS_FALLBACK; // replaced once loadSections() resolves

async function initSectionBox(){
  const input = document.getElementById('skSection');
  const list = document.getElementById('skSectionList');
  sectionsList = await loadSections(sb);
  initCombobox(input, list, sectionsList, (val)=>{ chosenSection = val; });
}

// Prefills from the Passport registration (same student), and from any
// skills registration already saved on this device.
function prefill(){
  const reg = loadSkillsReg();
  document.getElementById('skName').value = reg?.name || state.name || '';
  document.getElementById('skId').value = reg?.studentId || state.studentId || '';
  document.getElementById('skSection').value = reg?.section || '';
  chosenSection = reg?.section || null;
  if(reg) showDone(reg);
}

function showErr(msg){ const e=document.getElementById('skErr'); e.textContent=msg; e.style.display='block'; }
function clearErr(){ document.getElementById('skErr').style.display='none'; }

async function submitSkillsReg(){
  const name = document.getElementById('skName').value.trim();
  const studentId = document.getElementById('skId').value.trim();
  const section = document.getElementById('skSection').value.trim();

  if(!name || !studentId || !section){ showErr('Name, Student ID and Section are all required.'); return; }
  const nameErr = validateName(name); if(nameErr){ showErr(nameErr); return; }
  const idErr = validateStudentId(studentId); if(idErr){ showErr(idErr); return; }
  if(!sectionsList.includes(section)){ showErr('Pick a section from the list (type your course, e.g. "BSIT", to filter).'); return; }
  clearErr();

  const reg = {name, studentId, section, savedAt: Date.now(), synced:false};
  saveSkillsReg(reg);
  showDone(reg);

  if(sb){
    try{
      const {error} = await sb.from('skills_registrations').upsert({student_id: studentId, name, section});
      if(error) throw error;
      reg.synced = true; saveSkillsReg(reg);
      showToast('Registered and synced to cloud');
    }catch(e){
      // Real reason surfaced here — a silent "will sync once online" made a
      // permanent failure (e.g. an RLS policy blocking the anon key) look
      // identical to a temporary offline blip.
      showToast('Saved on this device, cloud sync failed: '+e.message, true);
    }
  } else {
    showToast('Saved on this device (cloud not configured)');
  }
}

function showDone(reg){
  document.getElementById('formView').style.display='none';
  document.getElementById('doneView').style.display='block';
  document.getElementById('doneSummary').textContent = `${reg.name} · ${reg.studentId} · ${reg.section}` + (reg.synced ? '' : ' (pending sync)');
}
function editRegistration(){
  document.getElementById('formView').style.display='block';
  document.getElementById('doneView').style.display='none';
}

// ---- init ----
// Logged-in user's Student ID/name are locked in (staff/admin can still
// register on someone's behalf — the server-side policy allows "own record
// OR staff+"). The form stays hidden until the gate says we're good.
function onLoggedIn(profile){
  if(!state.studentId || state.studentId !== profile.student_id){ state.studentId = profile.student_id; state.name = profile.name || profile.student_id; saveState(state); }
  prefill();
  if(!roleMeets(profile.role, 'staff')){
    document.getElementById('skId').value = profile.student_id; document.getElementById('skId').readOnly = true;
    if(profile.name){ document.getElementById('skName').value = profile.name; }
  }
  if(!loadSkillsReg()) document.getElementById('formView').style.display='block';
  if(sb){ const pending = loadSkillsReg(); if(pending && !pending.synced) submitSkillsReg(); }
}
function initSb(){ sb = initSupabase(cfg); mountAuthGate(sb, {containerId:'authGate', minRole:'user', signupName:true, onReady:onLoggedIn}); }
renderNetStatus();
initSb();
initSectionBox(); // pulls the live list from Supabase (sections are publicly readable)
window.addEventListener('online', ()=>{ state.online=true; saveState(state); renderNetStatus(); const pending=loadSkillsReg(); if(pending && !pending.synced && sb) submitSkillsReg(); });
window.addEventListener('offline', ()=>{ state.online=false; saveState(state); renderNetStatus(); });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('service-worker.js').catch(e=>console.warn('SW registration failed', e)); }
</script>
</body>
</html>
